<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%" style="background: linear-gradient(135deg, #0b0f19 0%, #111827 50%, #1e1b4b 100%); border-radius: 16px; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Styles and Animations -->
    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(3deg); }
      }
      @keyframes floatFast {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-18px) rotate(-4deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes dashAnim {
        to { stroke-dashoffset: -100; }
      }
      .floating-node-1 { animation: floatSlow 7s ease-in-out infinite; }
      .floating-node-2 { animation: floatFast 5s ease-in-out infinite; }
      .floating-node-3 { animation: floatSlow 9s ease-in-out infinite reverse; }
      .pulse-bg { animation: pulseGlow 8s ease-in-out infinite; transform-origin: center; }
      .network-line { stroke-dasharray: 6, 6; animation: dashAnim 15s linear infinite; }
    </style>
  </defs>

  <!-- Glowing Background Orbs -->
  <circle cx="200" cy="100" r="160" fill="url(#glowGrad)" class="pulse-bg" />
  <circle cx="1050" cy="260" r="180" fill="url(#glowGrad)" class="pulse-bg" style="animation-delay: -4s;" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Constellation / Network Lines -->
  <g stroke="rgba(129, 140, 248, 0.4)" stroke-width="1.5" fill="none">
    <path d="M 850,90 L 980,140 L 1100,80 L 1050,220 L 940,270 L 820,200 Z" class="network-line" />
    <line x1="980" y1="140" x2="940" y2="270" stroke="rgba(56, 189, 248, 0.3)" />
    <line x1="850" y1="90" x2="1050" y2="220" stroke="rgba(192, 132, 252, 0.3)" />
  </g>

  <!-- Interactive Network Nodes with Floating Animation -->
  <g class="floating-node-1">
    <circle cx="850" cy="90" r="16" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="2" />
    <text x="850" y="94" font-size="11" fill="#38bdf8" text-anchor="middle" font-weight="bold">SIS</text>
  </g>

  <g class="floating-node-2">
    <circle cx="980" cy="140" r="22" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="2" filter="url(#glow)" />
    <text x="980" y="145" font-size="12" fill="#e0e7ff" text-anchor="middle" font-weight="bold">ERP</text>
  </g>

  <g class="floating-node-3">
    <circle cx="1100" cy="80" r="15" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="2" />
    <text x="1100" y="84" font-size="10" fill="#c084fc" text-anchor="middle" font-weight="bold">LMS</text>
  </g>

  <g class="floating-node-1" style="animation-delay: -2s;">
    <circle cx="1050" cy="220" r="18" fill="url(#cardGrad)" stroke="#22d3ee" stroke-width="2" />
    <text x="1050" y="224" font-size="11" fill="#22d3ee" text-anchor="middle" font-weight="bold">CRM</text>
  </g>

  <g class="floating-node-2" style="animation-delay: -3s;">
    <circle cx="940" cy="270" r="19" fill="url(#cardGrad)" stroke="#f472b6" stroke-width="2" />
    <text x="940" y="274" font-size="11" fill="#f472b6" text-anchor="middle" font-weight="bold">SSO</text>
  </g>

  <g class="floating-node-3" style="animation-delay: -1s;">
    <circle cx="820" cy="200" r="16" fill="url(#cardGrad)" stroke="#4ade80" stroke-width="2" />
    <text x="820" y="204" font-size="10" fill="#4ade80" text-anchor="middle" font-weight="bold">API</text>
  </g>

  <!-- Left Content: Titles, Subtitle, Tags -->
  <g transform="translate(60, 45)">
    <!-- Top Pill Badge -->
    <rect x="0" y="0" width="280" height="28" rx="14" fill="rgba(99, 102, 241, 0.15)" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1" />
    <circle cx="14" cy="14" r="5" fill="#4ade80" />
    <text x="28" y="19" font-size="12" fill="#e0e7ff" font-weight="600" letter-spacing="0.5">CURATED AWESOME ECOSYSTEM</text>

    <!-- Main Title with Gradient -->
    <text x="0" y="80" font-size="44" font-weight="900" fill="url(#primaryGrad)" letter-spacing="-1">
      Awesome University Management
    </text>

    <!-- Subtitle -->
    <text x="0" y="125" font-size="18" fill="#94a3b8" font-weight="400">
      Enterprise ERP, SIS, Open-Source Platforms, Campus Ops &amp; Academic Tech
    </text>

    <!-- Capability Tags / Pills -->
    <g transform="translate(0, 165)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="145" height="32" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
      <text x="72" y="20" font-size="12" fill="#cbd5e1" text-anchor="middle" font-weight="500">🎓 Student Info (SIS)</text>

      <!-- Tag 2 -->
      <rect x="155" y="0" width="135" height="32" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
      <text x="222" y="20" font-size="12" fill="#cbd5e1" text-anchor="middle" font-weight="500">🏛️ University ERP</text>

      <!-- Tag 3 -->
      <rect x="300" y="0" width="155" height="32" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
      <text x="377" y="20" font-size="12" fill="#cbd5e1" text-anchor="middle" font-weight="500">⚡ Open-Source Stacks</text>

      <!-- Tag 4 -->
      <rect x="465" y="0" width="145" height="32" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
      <text x="537" y="20" font-size="12" fill="#cbd5e1" text-anchor="middle" font-weight="500">📊 Pricing &amp; Metrics</text>
    </g>

    <!-- Bottom Stat Highlights -->
    <g transform="translate(0, 230)">
      <text x="0" y="16" font-size="13" fill="#64748b" font-weight="500">
        🚀 <tspan fill="#38bdf8" font-weight="bold">35+ Curated Systems</tspan> • 🏢 <tspan fill="#818cf8" font-weight="bold">SaaS &amp; Self-Hosted</tspan> • 🔓 <tspan fill="#a855f7" font-weight="bold">100% Free &amp; Open Alternatives</tspan>
      </text>
    </g>
  </g>
</svg>
